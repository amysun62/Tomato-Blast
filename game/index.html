<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tomato Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  /* 排版规范：UI 底板全部是 Yoroll 生成的图片；文字只放在底板预留的空位里，绝不压边框；
     屏幕分三块安全区——顶部信息区 / 中间游戏区 / 底部道具栏，互不重叠（游戏区尺寸由 JS 读取 CSS 变量计算） */
  :root {
    --hud-h: 132px;
    --bar-h: 118px;
    --ink: #4a1a10;
    --stroke: #8e150c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a14; color: #fff;
    font-family: "Lilita One", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  img { display: block; pointer-events: none; -webkit-user-drag: none; }
  .stroke { color: #fff; text-shadow: 0 2px 0 var(--stroke), 0 -1px 0 var(--stroke), 1.5px 0 0 var(--stroke), -1.5px 0 0 var(--stroke), 0 4px 6px rgba(0,0,0,.35); }

  /* ---------- 顶部信息区 ---------- */
  #hud { position: fixed; left: 0; right: 0; top: 0; height: calc(var(--hud-h) + env(safe-area-inset-top)); padding-top: calc(env(safe-area-inset-top) + 8px);
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  #banner { position: relative; width: min(92vw, 380px); aspect-ratio: 640 / 159; }
  #banner > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 左侧奶油圆徽章的空位：关卡号 */
  #lvlSlot { position: absolute; left: 3.2%; top: 14%; width: 17.6%; height: 72%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink); line-height: .9; }
  #lvlSlot small { font-size: clamp(8px, 2.3vw, 10px); letter-spacing: .5px; opacity: .8; }
  #lvlSlot b { font-size: clamp(18px, 6vw, 26px); }
  /* 缎带中段的空位：番茄弹药 + 难度标签（左右分开，互不重叠） */
  #ribbonSlot { position: absolute; left: 25%; right: 9%; top: 18%; bottom: 26%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #ammo { display: flex; align-items: center; gap: 4px; font-size: clamp(20px, 6.4vw, 28px); }
  #ammo img { height: 1.25em; }
  #tag { position: relative; height: 82%; aspect-ratio: 640 / 164; display: none; }
  #tag.on { display: block; }
  #tag img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tag span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(11px, 3.4vw, 15px); font-family: "PingFang SC", sans-serif; font-weight: 800; }
  #chapter { font-size: 13px; font-family: "PingFang SC", sans-serif; font-weight: 800; letter-spacing: 1px; }
  /* 进度条：数字放在条的右边，不压在条上 */
  #progress { display: flex; align-items: center; gap: 8px; }
  #barBox { position: relative; width: min(56vw, 230px); aspect-ratio: 640 / 79; }
  #barBox > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #barClip { position: absolute; left: 4%; right: 4%; top: 22%; bottom: 22%; overflow: hidden; border-radius: 99px; }
  #barFill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; transition: width .3s; }
  #barFill img { height: 100%; width: 100%; object-fit: fill; }
  #left { font-size: 15px; min-width: 52px; }

  #toast { position: fixed; left: 50%; top: calc(var(--hud-h) + 40px); transform: translateX(-50%) scale(.6); opacity: 0; pointer-events: none;
    font-size: 28px; white-space: nowrap; transition: all .35s cubic-bezier(.2,1.6,.4,1); }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  /* 连击大字：图片 + 倍数 */
  #combo { position: fixed; left: 50%; top: 36%; width: min(70vw, 300px); transform: translate(-50%, -50%) scale(.4); opacity: 0; pointer-events: none; text-align: center; }
  #combo b { display: block; font-size: 54px; line-height: 1; margin-bottom: 2px; }
  #combo img { width: 100%; }
  #combo.show { animation: comboPop .95s cubic-bezier(.2,1.8,.4,1) forwards; }
  @keyframes comboPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-6deg); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(3deg); }
    30% { transform: translate(-50%, -50%) scale(1) rotate(-1deg); }
    80% { opacity: 1; transform: translate(-50%, -58%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(.92); }
  }

  /* ---------- 底部道具栏（右侧一排，文字在按钮下方） ---------- */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--bar-h) + env(safe-area-inset-bottom)); padding: 0 14px calc(env(safe-area-inset-bottom) + 10px);
    display: flex; justify-content: flex-end; align-items: flex-end; gap: 12px; pointer-events: none; }
  .boost { pointer-events: auto; position: relative; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; }
  .boost .btn { position: relative; width: 70px; height: 70px; transition: transform .12s; }
  .boost .btn > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .boost .btn .icon { position: absolute; inset: 20%; width: 60%; height: 60%; }
  .boost .cnt { position: absolute; right: -6px; top: -6px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: #fff7e8; color: var(--stroke);
    font-size: 15px; line-height: 22px; border: 2px solid var(--stroke); text-align: center; }
  .boost em { font-style: normal; font-size: 12px; font-family: "PingFang SC", sans-serif; font-weight: 800; }
  .boost:active .btn { transform: scale(.92); }
  .boost.armed .btn { transform: scale(1.12); filter: drop-shadow(0 0 10px #ffd34d) drop-shadow(0 0 4px #fff); }
  .boost.locked .btn, .boost.empty .btn { filter: grayscale(1) brightness(.85); opacity: .7; }

  /* ---------- 弹窗（底板图片 ui_panel；标题在格子带下方，按钮是图片底板 + 居中文字） ---------- */
  #panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(30,12,8,.55); padding: 16px; }
  #panel.hidden { display: none; }
  .card { position: relative; width: min(86vw, 340px); aspect-ratio: 640 / 612; animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  .card > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card .inner { position: absolute; left: 10%; right: 10%; top: 20%; bottom: 9%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; color: var(--ink); }
  #pTitleImg { width: 86%; margin-top: -6%; }
  #pTitle { font-size: 30px; color: #c41e12; }
  #pText { font-size: 15px; font-family: "PingFang SC", sans-serif; font-weight: 600; line-height: 1.5; }
  .btns { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pbtn { position: relative; width: 76%; aspect-ratio: 640 / 237; border: 0; background: none; padding: 0; cursor: pointer; font-family: inherit; }
  .pbtn > img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pbtn span { position: absolute; inset: 0 12%; display: flex; align-items: center; justify-content: center; font-size: 21px; padding-bottom: 3%; }
  .pbtn.cream { aspect-ratio: 640 / 197; width: 66%; }
  .pbtn.cream span { color: var(--stroke); font-size: 18px; text-shadow: none; }
  .pbtn:active { transform: scale(.95); }
  .hidden { display: none !important; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- 开始界面 ---------- */
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6vh; background: rgba(40,16,8,.25); }
  #start img.logo { width: min(86vw, 420px); filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); animation: float 3s ease-in-out infinite; }
  #start .pbtn { width: min(60vw, 240px); }
  @keyframes float { 50% { transform: translateY(-8px) rotate(-1deg); } }

  #nav { position: fixed; top: calc(var(--hud-h) + 70px); left: 10px; display: flex; flex-direction: column; gap: 6px; }
  body:not(.debug) #nav { display: none; }
  #nav button { pointer-events: auto; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid #fff; background: rgba(0,0,0,.4); color: #fff; font-size: 13px; font-family: inherit; }
</style>
<script type="importmap">
{ "imports": { "planck": "https://cdn.jsdelivr.net/npm/planck@1.0.6/dist/planck.mjs" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="banner">
    <img src="assets/ui/ui_banner.png" alt="">
    <div id="lvlSlot"><small>LEVEL</small><b id="lvlNum">1</b></div>
    <div id="ribbonSlot">
      <div id="ammo" class="stroke"><img src="assets/ui/icon_tomato.png" alt=""><span>×<b id="shots">0</b></span></div>
      <div id="tag"><img id="tagImg" src="assets/ui/ui_tag_hard.png" alt=""><span id="tagText" class="stroke">困难</span></div>
    </div>
  </div>
  <div id="chapter" class="stroke"></div>
  <div id="progress">
    <div id="barBox"><img src="assets/ui/ui_bar_frame.png" alt=""><div id="barClip"><div id="barFill"><img src="assets/ui/ui_bar_fill.png" alt=""></div></div></div>
    <div id="left" class="stroke"></div>
  </div>
</div>
<div id="toast" class="stroke"></div>
<div id="combo"><b class="stroke" id="comboNum"></b><img id="comboImg" alt=""></div>

<div id="bar">
  <button class="boost" id="bTri" data-k="tri"><div class="btn"><img src="assets/ui/ui_btn_round.png" alt=""><img class="icon" src="assets/ui/icon_triple.png" alt=""><span class="cnt">3</span></div><em class="stroke">三连发</em></button>
  <button class="boost" id="bRocket" data-k="rocket"><div class="btn"><img src="assets/ui/ui_btn_round.png" alt=""><img class="icon" src="assets/ui/icon_rocket.png" alt=""><span class="cnt">3</span></div><em class="stroke">穿甲火箭</em></button>
  <button class="boost" id="bBig" data-k="big"><div class="btn"><img src="assets/ui/ui_btn_round.png" alt=""><img class="icon" src="assets/ui/icon_melon.png" alt=""><span class="cnt">3</span></div><em class="stroke">西瓜弹</em></button>
</div>

<div id="nav"><button id="prev">‹</button><button id="next">›</button><button id="theme">换皮</button><button id="mute">🔊</button></div>

<div id="panel" class="hidden">
  <div class="card">
    <img class="bg" src="assets/ui/ui_panel.png" alt="">
    <div class="inner">
      <img id="pTitleImg" src="assets/ui/txt_clear.png" alt="">
      <div id="pTitle" class="hidden"></div>
      <div id="pText"></div>
      <div class="btns">
        <button class="pbtn" id="pMain"><img src="assets/ui/ui_btn_green.png" alt=""><span class="stroke" id="pMainText"></span></button>
        <button class="pbtn cream" id="pAlt"><img src="assets/ui/ui_btn_cream.png" alt=""><span id="pAltText"></span></button>
      </div>
    </div>
  </div>
</div>

<div id="start">
  <img class="logo" src="assets/ui/logo.png" alt="Tomato Blast">
  <button class="pbtn" id="startBtn"><img src="assets/ui/ui_btn_green.png" alt=""><span class="stroke">开始游戏</span></button>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
