<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tomato Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --tomato: #e5372b;
    --tomato-dark: #a8231b;
    --cream: #fff1d6;
    --basil: #3daa5c;
    --ink: #3a1d14;
    --gold: #f6c33b;
    --hard: #8b3fd1;
    --super: #c4122a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fd6c8; color: var(--ink);
    font-family: "Lilita One", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; user-select: none; }

  /* 背景：AI 画的整张场景图（学 Royal 的 GameplayBG_*），桌子浮在前面 */
  #bg { position: fixed; inset: 0; background-size: cover; background-position: center; transition: opacity .4s; }
  #tint { position: fixed; inset: 0; pointer-events: none; transition: background .4s; }
  #tint.hard { background: radial-gradient(ellipse at center, rgba(139,63,209,0) 35%, rgba(90,30,160,.45) 100%); }
  #tint.super { background: radial-gradient(ellipse at center, rgba(196,18,42,0) 30%, rgba(160,10,30,.55) 100%); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0; }
  #banner { display: flex; align-items: center; gap: 12px; background: var(--tomato); border: 4px solid var(--cream);
    border-radius: 22px; padding: 6px 16px 6px 10px; box-shadow: 0 5px 0 var(--tomato-dark), 0 10px 22px rgba(0,0,0,.2);
    color: var(--cream); max-width: 100%; }
  .lvl { display: flex; flex-direction: column; align-items: center; line-height: 1; background: var(--tomato-dark);
    border-radius: 14px; padding: 6px 10px; min-width: 64px; }
  .lvl small { font-size: 12px; letter-spacing: 1px; opacity: .9; }
  .lvl b { font-size: 30px; }
  .ammo { display: flex; align-items: center; gap: 6px; font-size: 30px; }
  .ammo i { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a7a, var(--tomato) 55%, var(--tomato-dark));
    border: 2px solid var(--cream); position: relative; }
  .ammo i::after { content: ""; position: absolute; left: 9px; top: -6px; width: 10px; height: 8px; background: var(--basil); border-radius: 50% 50% 40% 40%; }
  #badge { display: none; font-size: 15px; padding: 4px 10px; border-radius: 999px; color: #fff; border: 2px solid var(--cream); }
  #badge.hard { display: block; background: var(--hard); }
  #badge.super { display: block; background: var(--super); box-shadow: 0 0 12px rgba(255,80,60,.8); }

  #chapter { margin-top: 8px; font-size: 13px; color: var(--cream); background: rgba(58,29,20,.55); padding: 3px 12px; border-radius: 999px;
    font-family: "PingFang SC", sans-serif; font-weight: 700; }
  #progress { margin-top: 8px; width: min(280px, 80vw); height: 20px; border-radius: 999px; background: rgba(58,29,20,.3);
    border: 3px solid var(--cream); overflow: hidden; position: relative; }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--basil), #7bd88f); transition: width .25s; }
  #left { position: absolute; inset: 0; text-align: center; font-size: 13px; line-height: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  #dda { margin-top: 6px; font-size: 12px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); min-height: 16px; font-family: "PingFang SC", sans-serif; }
  #toast { margin-top: 16px; font-size: 32px; color: var(--cream); background: var(--tomato); padding: 8px 22px; border-radius: 18px;
    border: 4px solid var(--cream); opacity: 0; transform: scale(.6); transition: all .35s cubic-bezier(.2,1.6,.4,1); box-shadow: 0 5px 0 var(--tomato-dark); }
  #toast.show { opacity: 1; transform: scale(1); }
  #toast.hard { background: var(--hard); }
  #toast.super { background: var(--super); }

  /* 连击：越连越大越抖，学消除类的爽感反馈 */
  #combo { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(.4); opacity: 0; pointer-events: none; text-align: center;
    color: #fff; text-shadow: 0 4px 0 var(--tomato-dark), 0 0 18px rgba(255,120,60,.9); -webkit-text-stroke: 2px var(--tomato); }
  #combo b { display: block; font-size: 64px; line-height: 1; }
  #combo span { display: block; font-size: 30px; color: var(--gold); -webkit-text-stroke: 2px var(--tomato-dark); }
  #combo.show { animation: comboPop .9s cubic-bezier(.2,1.8,.4,1) forwards; }
  @keyframes comboPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-8deg); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(4deg); }
    30% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
    80% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -75%) scale(.9); }
  }
  #nav { position: fixed; top: calc(env(safe-area-inset-top) + 150px); left: 12px; display: flex; flex-direction: column; gap: 6px; }
  /* 调试按钮平时不显示，网址带 ?debug=1 才出现 */
  body:not(.debug) #nav { display: none; }
  #nav button, .boost, .card button { pointer-events: auto; font-family: inherit; cursor: pointer; }
  #nav button { min-width: 34px; padding: 0 8px; white-space: nowrap; height: 34px; border-radius: 10px; border: 2px solid var(--cream); background: rgba(58,29,20,.45); color: var(--cream); font-size: 16px; }

  #boosters { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 28px); display: flex; justify-content: space-between;
    align-items: flex-end; padding: 0 16px; pointer-events: none; }
  .col { display: flex; flex-direction: column; gap: 30px; }
  .boost { position: relative; width: 70px; height: 70px; border-radius: 50%; border: 4px solid var(--cream); background: var(--tomato);
    box-shadow: 0 5px 0 var(--tomato-dark); display: flex; align-items: center; justify-content: center; padding: 0; transition: transform .1s; }
  .boost:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--tomato-dark); }
  .boost.armed { background: var(--basil); box-shadow: 0 5px 0 #23733b, 0 0 18px var(--gold); transform: scale(1.08); }
  .boost.empty { filter: grayscale(.8); opacity: .6; }
  .boost.locked { filter: grayscale(1); opacity: .55; }
  .boost .cnt { position: absolute; right: -4px; bottom: -4px; min-width: 26px; height: 26px; border-radius: 13px; background: var(--cream);
    color: var(--tomato); font-size: 16px; line-height: 22px; border: 2px solid var(--tomato); padding: 0 4px; }
  .boost em { position: absolute; bottom: -21px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 12px; color: #fff;
    white-space: nowrap; font-family: "PingFang SC", sans-serif; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.7); }

  #panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(40,20,14,.45); padding: 16px; }
  #panel.hidden { display: none; }
  .card { width: min(340px, 100%); background: var(--cream); border: 5px solid var(--tomato); border-radius: 26px; padding: 22px 18px 18px; text-align: center;
    box-shadow: 0 8px 0 var(--tomato-dark); animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h2 { margin: 0 0 6px; font-size: 38px; color: var(--tomato); }
  .card p { margin: 0 0 16px; font-size: 16px; font-family: "PingFang SC", sans-serif; line-height: 1.5; }
  .btns { display: flex; flex-direction: column; gap: 10px; }
  .card button { font-size: 22px; padding: 10px; border-radius: 16px; border: 3px solid var(--ink); }
  #pMain { background: var(--basil); color: #fff; box-shadow: 0 4px 0 #23733b; }
  #pAlt { background: #fff; color: var(--ink); }
  #pAlt.hidden { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
</head>
<body>
<div id="bg"></div>
<div id="tint"></div>
<canvas id="c"></canvas>

<div id="hud">
  <div id="banner">
    <div class="lvl"><small>LEVEL</small><b id="lvlNum">1</b></div>
    <div id="badge"></div>
    <div class="ammo"><i></i>×<b id="shots">0</b></div>
  </div>
  <div id="chapter"></div>
  <div id="progress"><div id="bar"></div><span id="left"></span></div>
  <div id="dda"></div>
  <div id="toast"></div>
</div>

<div id="nav">
  <button id="prev" title="上一关">‹</button><button id="next" title="下一关">›</button>
  <button id="theme" title="同一关换食物主题">换皮</button>
  <button id="mute" title="声音开关">🔊</button>
</div>
<div id="combo"></div>

<div id="boosters">
  <div class="col">
    <button id="bRocket" class="boost" data-k="rocket" title="穿甲火箭：直线穿透一切">
      <svg width="40" height="40" viewBox="0 0 40 40"><g transform="rotate(45 20 20)">
        <path d="M20 3 C26 9 26 22 24 29 L16 29 C14 22 14 9 20 3 Z" fill="#fff1d6" stroke="#a8231b" stroke-width="2"/>
        <circle cx="20" cy="15" r="3.5" fill="#4db8f2"/><path d="M16 29 L12 35 L17 32 Z M24 29 L28 35 L23 32 Z" fill="#f6c33b"/>
        <path d="M18 30 L20 38 L22 30 Z" fill="#ff7a1a"/></g></svg>
      <span class="cnt">3</span><em>穿甲火箭</em>
    </button>
    <button id="bTri" class="boost" data-k="tri" title="三连小番茄：一次发射三颗">
      <svg width="44" height="38" viewBox="0 0 48 40"><g stroke="#fff1d6" stroke-width="2.5" fill="#ff6a55">
        <circle cx="12" cy="26" r="9"/><circle cx="36" cy="26" r="9"/><circle cx="24" cy="12" r="9"/></g></svg>
      <span class="cnt">3</span><em>三连发</em>
    </button>
  </div>
  <div class="col">
    <button id="bBig" class="boost" data-k="big" title="西瓜炮弹：又大又重">
      <svg width="42" height="42" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="#3daa5c" stroke="#fff1d6" stroke-width="3"/>
        <path d="M12 8 Q8 22 12 36 M22 3 Q18 22 22 41 M32 8 Q36 22 32 36" stroke="#1f6b35" stroke-width="3" fill="none"/></svg>
      <span class="cnt">3</span><em>西瓜弹</em>
    </button>
  </div>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <h2 id="pTitle"></h2>
    <p id="pText"></p>
    <div class="btns"><button id="pMain"></button><button id="pAlt"></button></div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
